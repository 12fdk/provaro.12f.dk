name: IndexNow

# Notify IndexNow-participating search engines (Bing, Yandex, Seznam, Naver, Yep)
# whenever a GitHub Pages deploy succeeds. Auto-discovers the sitemap and submits
# only the URLs that changed since the previous deploy. Works for Hugo, Astro,
# and plain-HTML (legacy branch) Pages sites without per-repo configuration.
#
# The IndexNow key is PUBLIC by design (served as {key}.txt at the site root),
# so it is safe to hard-code here. Google does not participate in IndexNow.

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    # Only act on a *successful* GitHub Pages deployment.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      # Checkout is only needed as a fallback to read CNAME when the deployment
      # event does not carry the site URL (can happen for legacy branch Pages).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous sitemap snapshot
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            indexnow-${{ github.repository }}-

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: b0b687723d7b1c12e407c2dfb52947d1
          SITE_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          key = os.environ["INDEXNOW_KEY"]

          # --- Resolve the live site base URL -------------------------------
          site = (os.environ.get("SITE_URL") or os.environ.get("TARGET_URL") or "").strip()
          if not site:
              # Fallback: a CNAME file (custom domain) in the checked-out repo.
              for cname in ("CNAME", "static/CNAME", "public/CNAME"):
                  if os.path.exists(cname):
                      dom = open(cname).read().strip()
                      if dom:
                          site = f"https://{dom}/"
                          break
          if not site:
              print("Could not determine the site URL; nothing to do.")
              sys.exit(0)
          if not site.endswith("/"):
              site += "/"
          host = urlparse(site).netloc
          print(f"Site: {site}  (host: {host})")

          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "indexnow-gha"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          # --- Discover sitemap(s) ------------------------------------------
          def discover():
              maps = []
              try:
                  robots = fetch(site + "robots.txt").decode(errors="replace")
                  for line in robots.splitlines():
                      if line.lower().startswith("sitemap:"):
                          maps.append(line.split(":", 1)[1].strip())
              except Exception:
                  pass
              if not maps:
                  for cand in ("sitemap.xml", "sitemap-index.xml", "sitemap_index.xml"):
                      try:
                          fetch(site + cand)
                          maps.append(site + cand)
                          break
                      except Exception:
                          pass
              return maps

          def parse_sitemap(url, seen=None):
              """Return {loc: lastmod}, following sitemap indexes."""
              seen = seen if seen is not None else set()
              if url in seen:
                  return {}
              seen.add(url)
              out = {}
              try:
                  root = ET.fromstring(fetch(url))
              except Exception as e:
                  print(f"Could not read {url}: {e}")
                  return out
              if root.tag.split('}')[-1] == "sitemapindex":
                  for sm in root.findall(f"{NS}sitemap"):
                      loc = sm.findtext(f"{NS}loc")
                      if loc:
                          out.update(parse_sitemap(loc.strip(), seen))
              else:
                  for u in root.findall(f"{NS}url"):
                      loc = u.findtext(f"{NS}loc")
                      if not loc:
                          continue
                      out[loc.strip()] = (u.findtext(f"{NS}lastmod") or "").strip()
              return out

          current = {}
          for sm in discover():
              print(f"Sitemap: {sm}")
              current.update(parse_sitemap(sm))

          def submit(urls):
              endpoint = "https://api.indexnow.org/indexnow"
              for i in range(0, len(urls), 10000):
                  batch = urls[i:i + 10000]
                  payload = json.dumps({
                      "host": host, "key": key,
                      "keyLocation": f"{site}{key}.txt",
                      "urlList": batch,
                  }).encode()
                  req = urllib.request.Request(
                      endpoint, data=payload,
                      headers={"Content-Type": "application/json; charset=utf-8"},
                      method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          print(f"IndexNow responded {r.status} for {len(batch)} URL(s)")
                  except urllib.error.HTTPError as e:
                      print(f"IndexNow HTTP {e.code}: {e.read().decode(errors='replace')}")
                      if e.code >= 400:
                          sys.exit(1)

          # --- No sitemap: treat as a single-page site, submit the homepage --
          if not current:
              print("No sitemap found — submitting the homepage.")
              submit([site])
              sys.exit(0)

          print(f"Sitemap has {len(current)} URL(s)")

          # --- Diff against the previous deploy's snapshot -------------------
          os.makedirs(".indexnow", exist_ok=True)
          snap = ".indexnow/sitemap.json"
          previous = {}
          if os.path.exists(snap):
              try:
                  previous = json.load(open(snap))
              except Exception:
                  previous = {}

          have_lastmod = any(current.values())
          if not previous:
              changed = sorted(current)
              print("First run (no snapshot) — submitting all URLs.")
          elif have_lastmod:
              changed = sorted(u for u, lm in current.items() if previous.get(u) != lm)
          else:
              # No <lastmod> anywhere: can only reliably detect brand-new URLs.
              changed = sorted(u for u in current if u not in previous)

          json.dump(current, open(snap, "w"))

          if not changed:
              print("No changed URLs since last deploy.")
              sys.exit(0)

          print(f"Submitting {len(changed)} URL(s) to IndexNow:")
          for u in changed:
              print("  " + u)
          submit(changed)
          PY
